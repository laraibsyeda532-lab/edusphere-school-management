<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - EduSphere</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #172554;
        }

        .back-btn {
            background: #172554;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #172554;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #172554;
        }

        .button-area {
            margin-top: 20px;
        }

        button {
            border: none;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .add-btn {
            background: #172554;
            color: white;
        }

        .cancel-btn {
            background: #e5e7eb;
            margin-left: 8px;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #172554;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            border-radius: 12px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #172554;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Teachers Management</h1>
        <a href="admin-dashboard.html" class="back-btn">← Dashboard</a>
    </div>


    <!-- ADD TEACHER -->

    <div class="card">

        <h2>Add Teacher</h2>

        <form id="teacherForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Employee ID *</label>
                    <input type="text" id="employee_id" required>
                </div>

                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone">
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="subject">
                </div>

                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" id="qualification">
                </div>

            </div>

            <div class="button-area">

                <button type="submit" class="add-btn">
                    Add Teacher
                </button>

            </div>

            <div id="message" class="message"></div>

        </form>

    </div>


    <!-- TEACHERS LIST -->

    <div class="card">

        <h2>Teachers List</h2>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search by name, employee ID, subject or phone..."
        >

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Subject</th>
                        <th>Qualification</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="teachersTableBody"></tbody>

            </table>

        </div>

    </div>

</div>


<!-- EDIT MODAL -->

<div class="modal" id="editModal">

    <div class="modal-content">

        <h2>Edit Teacher</h2>

        <form id="editTeacherForm">

            <input type="hidden" id="edit_id">

            <div class="form-grid">

                <div class="form-group">
                    <label>Employee ID *</label>
                    <input type="text" id="edit_employee_id" required>
                </div>

                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="edit_name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit_email">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="edit_phone">
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="edit_subject">
                </div>

                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" id="edit_qualification">
                </div>

            </div>

            <div class="button-area">

                <button type="submit" class="add-btn">
                    Update Teacher
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>


<script>

let allTeachers = [];


// ===============================
// LOAD TEACHERS
// ===============================

async function loadTeachers() {

    try {

        const response = await fetch("/api/teachers");

        const teachers = await response.json();

        allTeachers = teachers;

        displayTeachers(teachers);

    } catch (error) {

        console.error(error);

        alert("Could not load teachers.");

    }
}


// ===============================
// DISPLAY TEACHERS
// ===============================

function displayTeachers(teachers) {

    const tableBody =
        document.getElementById("teachersTableBody");

    tableBody.innerHTML = "";

    if (teachers.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="8" style="text-align:center;">
                    No teachers found.
                </td>
            </tr>
        `;

        return;
    }


    teachers.forEach(teacher => {

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${teacher.id}</td>

            <td>${teacher.employee_id || ""}</td>

            <td>${teacher.name || ""}</td>

            <td>${teacher.email || ""}</td>

            <td>${teacher.phone || ""}</td>

            <td>${teacher.subject || ""}</td>

            <td>${teacher.qualification || ""}</td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editTeacher(${teacher.id})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteTeacher(${teacher.id})"
                >
                    Delete
                </button>

            </td>

        `;

        tableBody.appendChild(row);

    });
}


// ===============================
// ADD TEACHER
// ===============================

document
    .getElementById("teacherForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const data = {

            employee_id:
                document.getElementById("employee_id").value,

            name:
                document.getElementById("name").value,

            email:
                document.getElementById("email").value,

            phone:
                document.getElementById("phone").value,

            subject:
                document.getElementById("subject").value,

            qualification:
                document.getElementById("qualification").value

        };


        try {

            const response = await fetch("/api/teachers", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });


            const result = await response.json();


            if (result.success) {

                document.getElementById("message").textContent =
                    "Teacher added successfully!";

                document.getElementById("message").style.color =
                    "green";

                document.getElementById("teacherForm").reset();

                loadTeachers();

            } else {

                document.getElementById("message").textContent =
                    result.message;

                document.getElementById("message").style.color =
                    "red";
            }


        } catch (error) {

            console.error(error);

            alert("Something went wrong.");

        }

    });


// ===============================
// SEARCH
// ===============================

document
    .getElementById("searchInput")
    .addEventListener("input", function() {

        const searchText =
            this.value.toLowerCase();

        const filtered =
            allTeachers.filter(teacher => {

                return (

                    (teacher.name || "")
                        .toLowerCase()
                        .includes(searchText)

                    ||

                    (teacher.employee_id || "")
                        .toLowerCase()
                        .includes(searchText)

                    ||

                    (teacher.subject || "")
                        .toLowerCase()
                        .includes(searchText)

                    ||

                    (teacher.phone || "")
                        .toLowerCase()
                        .includes(searchText)

                );

            });


        displayTeachers(filtered);

    });


// ===============================
// EDIT TEACHER
// ===============================

function editTeacher(id) {

    const teacher =
        allTeachers.find(t => t.id === id);

    if (!teacher) {
        return;
    }


    document.getElementById("edit_id").value =
        teacher.id;

    document.getElementById("edit_employee_id").value =
        teacher.employee_id || "";

    document.getElementById("edit_name").value =
        teacher.name || "";

    document.getElementById("edit_email").value =
        teacher.email || "";

    document.getElementById("edit_phone").value =
        teacher.phone || "";

    document.getElementById("edit_subject").value =
        teacher.subject || "";

    document.getElementById("edit_qualification").value =
        teacher.qualification || "";


    document.getElementById("editModal").style.display =
        "flex";
}


// ===============================
// UPDATE TEACHER
// ===============================

document
    .getElementById("editTeacherForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const id =
            document.getElementById("edit_id").value;


        const data = {

            employee_id:
                document.getElementById("edit_employee_id").value,

            name:
                document.getElementById("edit_name").value,

            email:
                document.getElementById("edit_email").value,

            phone:
                document.getElementById("edit_phone").value,

            subject:
                document.getElementById("edit_subject").value,

            qualification:
                document.getElementById("edit_qualification").value

        };


        try {

            const response = await fetch(
                `/api/teachers/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)
                }
            );


            const result =
                await response.json();


            if (result.success) {

                closeModal();

                loadTeachers();

                alert("Teacher updated successfully!");

            } else {

                alert(result.message);

            }

        } catch (error) {

            console.error(error);

            alert("Something went wrong.");

        }

    });


// ===============================
// DELETE TEACHER
// ===============================

async function deleteTeacher(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this teacher?");

    if (!confirmDelete) {
        return;
    }


    try {

        const response = await fetch(
            `/api/teachers/${id}`,
            {
                method: "DELETE"
            }
        );


        const result =
            await response.json();


        if (result.success) {

            loadTeachers();

            alert("Teacher deleted successfully!");

        } else {

            alert(result.message);

        }

    } catch (error) {

        console.error(error);

        alert("Something went wrong.");

    }

}


// ===============================
// CLOSE MODAL
// ===============================

function closeModal() {

    document.getElementById("editModal").style.display =
        "none";

}


// ===============================
// INITIAL LOAD
// ===============================

loadTeachers();

</script>

</body>
</html>
