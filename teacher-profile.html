    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#1f2937;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100vh;
    background:#172554;
    color:white;
    padding:20px 0;
    overflow-y:auto;

.logo{
    font-size:23px;
    font-weight:bold;
    padding:0 22px 25px;
}

.logo span{
    color:#60a5fa;
}

.menu a{
    display:block;
    padding:12px 22px;
    color:#dbeafe;
    text-decoration:none;
    font-size:14px;
}

.menu a:hover,
.menu a.active{
    background:#2563eb;
    color:white;
}

.main{
    margin-left:240px;

.header{

.header h1{
    font-size:28px;
}

.header p{
    color:#6b7280;
    margin-top:6px;
}

.profile-grid{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:22px;
}

.profile-card,
.info-card{
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.profile-card{
    text-align:center;
}

.avatar{
    width:100px;
    height:100px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:bold;
}

.profile-card h2{
    font-size:21px;
    margin-bottom:5px;
}

.role{
    color:#64748b;
    font-size:14px;
    margin-bottom:20px;
}

.profile-status{
    display:inline-block;
    background:#dcfce7;
    color:#166534;
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.info-card h2{
    margin-bottom:20px;
    font-size:20px;
